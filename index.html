<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050913">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline' https://unpkg.com; style-src 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; frame-src 'none'">
<title>IMEI Locator — Device Recovery Center</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{
  --bg:#050913;--navy:#0a1630;--navy2:#0d1d40;--card:rgba(14,28,58,.58);--card2:rgba(20,38,78,.5);
  --line:rgba(110,160,255,.16);--line2:rgba(110,160,255,.3);
  --blue:#2f6bff;--blue2:#5b8dff;--cyan:#22d3ee;--text:#e8f0ff;--muted:#93a4c4;
  --ok:#34d399;--warn:#fbbf24;--err:#fb7185;
  --r:18px;--shadow:0 10px 40px rgba(0,0,0,.45);
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--font);color:var(--text);background:var(--bg);min-height:100vh;line-height:1.55;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(47,107,255,.28),transparent 60%),
  radial-gradient(700px 420px at -10% 10%,rgba(34,211,238,.14),transparent 60%),
  linear-gradient(rgba(110,160,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(110,160,255,.04) 1px,transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px;background-attachment:fixed;padding-bottom:84px}
a{color:var(--cyan)}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.skip{position:absolute;left:-999px;top:8px;background:var(--cyan);color:#001018;padding:8px 14px;border-radius:10px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:0;z-index:50;background:rgba(5,9,19,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:42px;height:42px;filter:drop-shadow(0 0 10px rgba(34,211,238,.55))}
.brand b{display:block;font-size:1.08rem;letter-spacing:.2px}
.brand small{display:block;color:var(--cyan);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--card2);color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.pill.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}.pill.ok{color:#bff5df}
.pill.warn i{background:var(--warn);box-shadow:0 0 8px var(--warn)}.pill.warn{color:#fde8a8}
.pill.err i{background:var(--err);box-shadow:0 0 8px var(--err)}.pill.err{color:#ffc9d2}
.pill.info i{background:var(--blue2);box-shadow:0 0 8px var(--blue2)}.pill.info{color:#cddcff}
.deskNav{display:none;gap:4px;width:100%}
.nav-btn{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid transparent;color:var(--muted);padding:9px 14px;border-radius:12px;cursor:pointer;font:inherit;font-size:.9rem;transition:.2s}
.nav-btn:hover{color:var(--text);background:var(--card2)}
.nav-btn[aria-current=page]{color:#fff;background:linear-gradient(135deg,rgba(47,107,255,.5),rgba(34,211,238,.22));border-color:var(--line2);box-shadow:0 0 18px rgba(47,107,255,.35)}
.icon-btn{margin-left:2px}
@media(min-width:900px){.deskNav{display:flex;order:5}.bottom{display:none!important}body{padding-bottom:0}}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(5,9,19,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.bottom .nav-btn{flex-direction:column;gap:3px;font-size:.68rem;padding:7px 8px;min-width:58px;min-height:48px}
.bottom .nav-btn .ic{width:22px;height:22px}

/* layout */
main{max-width:1200px;margin:auto;padding:22px 16px 40px}
.panel{display:none}
.panel.active{display:block;animation:enter .38s cubic-bezier(.2,.8,.2,1)}
.no-motion .panel.active{animation:none}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:clamp(1.5rem,4.5vw,2.3rem);line-height:1.2;letter-spacing:-.01em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--blue2),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.15rem;margin-bottom:4px}
h3{font-size:1rem}
.lead{color:var(--muted);max-width:760px;margin:8px 0 22px}
.grid2{display:grid;gap:18px}
.grid3{display:grid;gap:18px;margin-top:18px}
@media(min-width:900px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}.grid3{grid-template-columns:repeat(3,1fr)}}
.col{display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(91,141,255,.45),transparent 40%,rgba(34,211,238,.25));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.chip{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(47,107,255,.35),rgba(34,211,238,.18));border:1px solid var(--line2);color:var(--cyan);box-shadow:0 0 18px rgba(47,107,255,.3);flex:none}
.card-h p{color:var(--muted);font-size:.85rem}
.muted{color:var(--muted)}.small{font-size:.84rem}

/* form */
label.lbl{display:block;font-weight:600;margin-bottom:8px;font-size:.92rem}
.field{position:relative}
.field .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--cyan)}
input[type=text],input[type=url],input[type=password]{width:100%;font:inherit;color:var(--text);background:rgba(4,10,24,.7);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;transition:.2s}
.field input{padding-left:44px;font-family:var(--mono);font-size:1.1rem;letter-spacing:.08em}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.2),0 0 24px rgba(34,211,238,.18)}
input[aria-invalid=true]{border-color:var(--err);box-shadow:0 0 0 3px rgba(251,113,133,.18)}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:.8rem;color:var(--muted)}
.err{color:#ffc2cb;font-size:.88rem;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.err[hidden]{display:none}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:11px 18px;border-radius:14px;border:1px solid var(--line2);font:inherit;font-weight:600;font-size:.93rem;color:var(--text);background:var(--card2);cursor:pointer;text-decoration:none;transition:.2s}
.btn:hover{border-color:var(--cyan);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.primary{background:linear-gradient(135deg,var(--blue),#1fb5d6);border-color:transparent;color:#fff;box-shadow:0 6px 24px rgba(47,107,255,.45)}
.btn.primary:hover{box-shadow:0 8px 30px rgba(34,211,238,.45)}
.btn.danger{border-color:rgba(251,113,133,.5);color:#ffc2cb}
.btn.sm{min-height:38px;padding:7px 12px;font-size:.84rem;border-radius:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* result */
.state{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1px solid var(--line2);background:rgba(4,10,24,.5);margin-bottom:14px}
.state .ic{width:24px;height:24px;margin-top:2px}
.state.ok{border-color:rgba(52,211,153,.45);color:#c9f7e4}.state.ok .ic{color:var(--ok)}
.state.warn{border-color:rgba(251,191,36,.45);color:#fdecb5}.state.warn .ic{color:var(--warn)}
.state.bad{border-color:rgba(251,113,133,.5);color:#ffd0d6}.state.bad .ic{color:var(--err)}
.state b{display:block;color:var(--text)}
.state span{font-size:.88rem;opacity:.92}
.idle{text-align:center;padding:26px 8px;color:var(--muted)}
.idle .ic{width:46px;height:46px;color:var(--blue2);margin-bottom:10px;opacity:.8}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.14),rgba(255,255,255,.05));background-size:200% 100%;animation:sh 1.2s infinite;margin:12px 0}
@keyframes sh{to{background-position:-200% 0}}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.part{background:rgba(4,10,24,.55);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.part small{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
.part code{font-family:var(--mono);color:var(--cyan);font-size:1.02rem;word-break:break-all}
.notice{font-size:.84rem;color:var(--muted);border-left:3px solid var(--blue2);padding:6px 12px;margin:12px 0;background:rgba(47,107,255,.08);border-radius:0 10px 10px 0}
.tracker{border-top:1px dashed var(--line2);margin-top:14px;padding-top:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--muted);margin:10px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--cyan);flex:none;margin-top:2px}

/* map */
#map{height:min(58vh,460px);min-height:320px;border-radius:14px;border:1px solid var(--line2);overflow:hidden;background:#07101f;position:relative;z-index:1}
.leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.92) contrast(.92) saturate(.65)}
.leaflet-container{font-family:var(--font)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--navy2);color:var(--text);border:1px solid var(--line2)}
.leaflet-bar a{background:var(--navy2);color:var(--text);border-color:var(--line)}
.leaflet-bar a:hover{background:var(--blue)}
.leaflet-control-attribution{background:rgba(5,9,19,.75)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--cyan)!important}
.mapwrap{position:relative}
.mapEmpty{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;background:rgba(5,9,19,.88);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;font-size:.86rem;pointer-events:none;display:flex;gap:10px}
.mapEmpty .ic{color:var(--warn);width:22px;height:22px}
.mapEmpty[hidden]{display:none}
.mapFail{padding:30px;text-align:center;color:var(--muted)}
.pin{width:22px;height:22px;border-radius:50%;background:var(--cyan);border:3px solid #fff;box-shadow:0 0 0 0 rgba(34,211,238,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
.no-motion .pin{animation:none}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:14px;font-size:.88rem}
dl.info dt{color:var(--muted)}dl.info dd{word-break:break-word}

/* lists */
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(4,10,24,.45);flex-wrap:wrap}
.item code{font-family:var(--mono);color:var(--cyan);letter-spacing:.06em}
.item .grow{flex:1;min-width:160px}
.item small{color:var(--muted);display:block}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:14px;font-size:.9rem}
details.acc{border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:12px;overflow:hidden}
details.acc summary{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;font-weight:600;list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--cyan);border-bottom:2px solid var(--cyan);transform:rotate(45deg);transition:.25s}
details.acc[open] summary::after{transform:rotate(-135deg)}
details.acc[open]{border-color:var(--line2);box-shadow:0 0 24px rgba(47,107,255,.2)}
.acc-b{padding:0 18px 18px;color:#cdd9f2}
.acc-b ol{padding-left:22px;display:grid;gap:8px;margin:6px 0 14px}
.acc-b li::marker{color:var(--cyan);font-weight:700}
.tag{display:inline-block;font-size:.72rem;padding:3px 9px;border-radius:999px;background:rgba(251,191,36,.14);color:#fde8a8;border:1px solid rgba(251,191,36,.35);margin-left:6px}
.warnbox{border:1px solid rgba(251,113,133,.45);background:rgba(251,113,133,.08);border-radius:16px;padding:16px 18px}
.warnbox ul,.plain{padding-left:20px;display:grid;gap:7px;margin-top:8px}
.switch{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-of-type{border:0}
.switch input{width:46px;height:26px;appearance:none;-webkit-appearance:none;background:#1b2a4d;border-radius:999px;position:relative;cursor:pointer;transition:.2s;border:1px solid var(--line2);flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:linear-gradient(135deg,var(--blue),var(--cyan))}
.switch input:checked::after{left:23px}
pre{background:rgba(4,10,24,.8);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;font-family:var(--mono);font-size:.78rem;color:#bcd0f5;margin:8px 0}
.stack{display:grid;gap:14px}
.two{display:grid;gap:18px}
@media(min-width:900px){.two{grid-template-columns:1fr 1fr}}

/* toast + dialog */
#toasts{position:fixed;right:14px;left:14px;bottom:92px;z-index:200;display:grid;gap:10px;justify-items:end;pointer-events:none}
@media(min-width:900px){#toasts{bottom:24px;left:auto;width:380px}}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;max-width:420px;padding:13px 16px;border-radius:14px;background:var(--navy2);border:1px solid var(--line2);box-shadow:var(--shadow);animation:enter .3s;font-size:.9rem}
.toast.success{border-color:rgba(52,211,153,.55)}.toast.success .ic{color:var(--ok)}
.toast.error{border-color:rgba(251,113,133,.6)}.toast.error .ic{color:var(--err)}
.toast.info .ic{color:var(--cyan)}
dialog{border:1px solid var(--line2);border-radius:20px;background:var(--navy2);color:var(--text);padding:0;width:min(92vw,440px);box-shadow:0 20px 70px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(2,5,12,.72);backdrop-filter:blur(4px)}
.dlg-b{padding:22px}
.dlg-b h3{margin-bottom:8px;display:flex;gap:10px;align-items:center}
.dlg-b .btns{justify-content:flex-end}
footer{max-width:1200px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.78rem;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
